  description: KYC 또는 권한 제한에 따라 요청을 처리할 수 없습니다.
- code: '51'
  title: This API is no longer available
  description: 더 이상 유효하지 않은 API 입니다.
- code: '52'
  title: Customers who did not complete the real name account verification are not
    allowed to use this service
  description: 실명 계좌 인증을 완료하지 않은 고객 입니다. 코인원 앱을 통해 실명 계좌 인증이 필요 합니다.
- code: '53'
  title: Order is rejected by market monitoring. Please contact CS center
  description: 이상거래 의심 내역이 탐지되어 거래를 할 수 없는 상태입니다. 고객 센터로 연락 부탁드립니다.
- code: '54'
  title: You can use the API after completing overseas tax verification by web or
    app.
  description: 해외 납세의무 정보가 미제출되었거나 확인이 완료되지 않은 경우 발생합니다.
- code: '101'
  title: Invalid format
  description: 유효하지 않은 포맷입니다.
- code: '103'
  title: Lack of Balance
  description: 잔고가 부족 합니다.
- code: '104'
  title: Order id is not exist
  description: 존재하지 않은 주문입니다.
- code: '105'
  title: Price is not correct
  description: 올바르지 않은 가격입니다.
- code: '107'
  title: Parameter error
  description: 파라메터 에러입니다.
- code: '108'
  title: Unknown cryptocurrency
  description: 존재하지 않은 종목 심볼입니다.
- code: '109'
  title: Unknown cryptocurrency pair
  description: 존재하지 않은 거래 종목입니다.
- code: '111'
