name: Coinone API Error Codes
generated: '2026-10-13'
method: searched
source: https://docs.coinone.co.kr/docs/error-code
format: application/json
envelope:
  v2.1_and_public_v2:
    result: error
    error_code: <code>
    error_msg: <message>
  private_v2_and_public_v1:
    result: error
    errorCode: <code>
    errorMsg: <message>
problems:
- code: '4'
