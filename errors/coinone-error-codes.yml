- code: '24'
  title: Invalid App Id
  description: 유효하지 않은 APP ID 입니다. 코인원 웹 > Open API 메뉴에서 상태 확인 부탁드립니다.
- code: '25'
  title: Request Token does not exist
  description: 존재하지 않은 Request Token 입니다.
- code: '26'
  title: Failed to delete Request Token
  description: Request Token 삭제를 실패 하였습니다.
- code: '27'
  title: Access Token does not exist
  description: 존재하지 않은 Access Token 입니다.
- code: '28'
  title: Failed to delete Access Token
  description: Access Token 삭제 실패 하였습니다.
- code: '29'
  title: Failed to refresh Access Token
  description: Access Token을 리프레쉬 하는데 실패 하였습니다.
- code: '40'
  title: Invalid API permission
  description: 승인되지 않은 API 권한입니다.
- code: '50'
  title: Your request cannot be processed due to incomplete identity verification
