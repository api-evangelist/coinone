  description: 주문 가격과 현재 가격의 현격한 차이로 주문이 불가 합니다.
- code: '116'
  title: Already Traded
  description: 이미 체결된 주문입니다.
- code: '117'
  title: Already Canceled
  description: 이미 취소된 주문입니다.
- code: '118'
  title: Already Submitted.
  description: 이미 등록된 주문입니다.
- code: '120'
  title: V2 API payload is missing
  description: V2 API payload 값 입력이 필요 합니다.
- code: '121'
  title: V2 API signature is missing
  description: V2 API signature 값 입력이 필요 합니다.
- code: '122'
  title: V2 API nonce is missing
  description: V2 API nonce 값 입력이 필요 합니다.
- code: '123'
  title: V2 API signature is not correct
  description: V2 API signature 값이 올바르지 않습니다.
- code: '130'
  title: V2 API Nonce value must be a positive integer
  description: V2 API Nonce 값은 양의 숫자 값이어야 합니다.
- code: '131'
  title: V2 API Nonce is must be bigger then last nonce
  description: V2 API Nonce 값은 이전 Nonce 값보다 커야 합니다.
- code: '132'
  title: Nonce already used
  description: 이미 사용된 Nonce 값 입니다.
- code: '133'
  title: Nonce must be in the form of a UUID
  description: Nonce값은 UUID 포맷이어야 합니다.
- code: '151'
  title: It's V2 API. V1 Access token is not acceptable
  description: V1의 Access Token으로는 V2 API 이용이 불가합니다.
- code: '152'
  title: Invalid address
  description: 유효하지 않은 주소입니다.
- code: '153'
  title: The address is detected by FDS. Please contact our customer center
  description: FDS에 의해 제한된 주소입니다. 고객 센터로 연락 부탁드립니다.
- code: '154'
  title: The address is not registered as an API withdrawal address
  description: API 출금 주소 등록이 필요한 주소입니다.
- code: '155'
  title: Withdrawal through the 'CODE Solution' requires registration of the deposit
    address
  description: CODE 솔루션을 통한 출금을 위해서는 입금 주소 생성이 필요합니다. 코인원 웹/앱에서 입금주소 생성 후 요청하시기 바랍니다.
- code: '156'
  title: The withdrawal address does not exist
  description: 존재하지 않은 출금 주소입니다.
- code: '157'
  title: Insufficient balance
  description: 잔액이 부족합니다.
- code: '158'
  title: Minimum withdrawal quantity insufficient
  description: 최소 출금 가능 금액보다 부족합니다.
- code: '159'
  title: Required the memo to proceed with the withdrawal
  description: 출금을 위해서는 Memo 입력이 필요합니다.
- code: '160'
  title: Withdrawal/Deposit id is invalid
  description: 단일 입출금 내역 조회 시 올바르지 않은 입출금 내역 식별 ID가 입력된 경우입니다.
- code: '161'
  title: price is required for LIMIT or STOP\_LIMIT order.
  description: 지정가, 예약 지정가 주문시 필수정보인 가격필드가 입력되지 않은 경우입니다.
- code: '162'
  title: qty is required for LIMIT or STOP\_LIMIT or MARKET(SELL) order.
  description: 지정가, 예약 지정가, 시장가(매도), 주문시 필수정보인 수량필드가 입력되지 않은 경우입니다.
- code: '163'
  title: post\_only is required for LIMIT order.
  description: 지정가 주문시 필수정보인 post\_only필드가 입력되지 않은 경우입니다.
- code: '164'
  title: trigger\_price is required for STOP\_LIMIT order
  description: 예약 지정가 주문시 필수정보인 trigger\_price 필드가 입력되지 않은 경우입니다.
- code: '165'
  title: amount is required for MARKET(BUY) order.
  description: 시장가(매수) 주문시 필수정보인 총액필드가 입력되지 않은 경우입니다.
- code: '166'
  title: Not Supported Order Type.
  description: "V2.1 \bOrder API 요청시 입력한 주문타입이 지원하지 않는 주문타입인 경우입니다.<br />가능한 주문 타입\
    \ : LIMIT, MARKET, STOP\\_LIMIT (대문자만 가능)"
- code: '167'
  title: trigger price and current price can not be same.
  description: 예약지정가 주문시 trigger\_price 에 입력하신 값이 해당 코인의 현재가와 동일한 경우입니다.
- code: '202'
  title: Withdrawal quantity is not correct
  description: 옳바르지 않은 출금 수량입니다. (최소 출금 수량 미만 혹은 지원하지 않는 자릿수)
- code: '300'
  title: Invalid order information
  description: 유효하지 않은 주문 정보입니다.
- code: '305'
  title: Invalid quantity
  description: 잘못된 수량이 입력되었습니다.
- code: '306'
  title: Cannot be process the orders below the minimum amount
  description: 최소 수량 이하로는 주문이 불가 합니다.
- code: '307'
  title: Cannot be process the orders exceed the maximum amount
  description: 최대 수량 이상으로는 주문이 불가 합니다.
- code: '308'
  title: Price is out of range.
  description: 주문 요청 시 입력한 가격이 최소 주문 가능 가격\~최대 주문 가능 가격 범위를 벗어날 경우 발생합니다.
- code: '309'
  title: Qty is out of range.
  description: 주문 요청 시 입력한 수량이 최소 주문 가능 수량\~최대 주문 가능 수량을 벗어날 경우 발생합니다.
- code: '310'
  title: Unavailable price unit. Please check the Range unit API to get the price\_unit.
  description: 가격 단위가 유효하지 않을 때 발생합니다.
- code: '312'
  title: Duplicated user\_order\_id
  description: 중복된 user\_order\_id
- code: '313'
  title: user\_order\_id and order\_Id cannot be requested together. Otherwise, neither
    was entered
  description: order\_id 와 user\_order\_id 가 함께 요청되거나, 둘다 입력되지 않았을 경우
- code: '314'
  title: Invalid user\_order\_id (It must be lower case)
  description: 잘못된 user\_order\_id (대문자 혹은 지원하지 않는 특문, 150자 초과)
- code: '315'
  title: The API does not support a portfolio.
  description: 포트폴리오를 지원하지 않는 API 입니다.
- code: '316'
  title: Invalid range
  description: 조회 범위가 올바르지 않을 경우
- code: '317'
  title: Invalid size
  description: 조회 사이즈가 올바르지 않을 경우
- code: '405'
  title: Server error
  description: 서버 에러가 발생하였습니다.
- code: '1201'
  title: The V2 order API only supports limit order types.
  description: v2의 특정 주문 조회 시(v2/order/query\_order) 조회하려는 주문이 지정가 주문이 아닌 경우 발생합니다.
    (v2는 시장가, 예약 지정가를 지원하지 않아 발생하는 에러입니다.)
- code: '1202'
  title: This API is deprecated and only supports limit order type.
  description: v21의 특정 주문 정보 조회 시(v2.1/order/info) 조회하려는 주문이 지정가 주문이 아닌 경우 발생합니다.
    (v2.1/order/info는 시장가, 예약 지정가를 지원하지 않아 발생하는 에러입니다.)
- code: '1206'
  title: User not found
  description: 존재하지 않은 고객입니다.
- code: '3001'
  title: Withdrawal of the virtual asset has been suspended. Please check our notice
  description: 출금이 일시적 혹은 영구적으로 정지된 가상자산입니다. 공지사항을 확인 부탁드립니다.
- code: '3002'
  title: Withdrawal is rejected
  description: 출금이 특정 사유로 인해 거절된 상태입니다.
- code: '3003'
  title: Exceed daily withdrawal limit
  description: 일일 출금 가능 수량을 초과 하였습니다.
- code: '3004'
  title: Failed by 24-hour withdrawal delay policy
  description: 24시간 출금 지연제에 의한 출금가능 한도 초과로 출금이 제한됩니다.
- code: '3005'
  title: Try again after complete phone verification
  description: 휴대폰 번호 인증 완료 하신 후에 재시도 부탁드립니다.
- code: '3006'
  title: Withdrawal is restricted for 72 hours after the first KRW deposit
  description: 최초 원화 입금 후 72시간 동안은 가상자산 출금이 제한됩니다.
- code: '3007'
  title: An error in the balance. Please contact CS center
  description: 잔고에 오류가 발생하였습니다. 고객 센터에 연락 부탁드립니다.
- code: '3009'
  title: Account was detected through FDS system monitoring
  description: 이상거래에 탐지되어 이용할 수 없는 상태입니다.
- code: '3010'
  title: Account is locked
  description: 계정 잠금으로 인해 출금이 불가한 경우입니다. 잠금 해제는 최신 버전의 앱 또는 웹페이지에서 로그인을 통해 진행할 수 있습니다.
- code: '3012'
  title: 'CODE error: withdrawal was rejected by CODE solution'
  description: CODE 솔루션에서 출금을 거절한 경우입니다.
- code: '3013'
  title: 'CODE error: invalid parameter'
  description: CODE 거래소 정보 또는 수취인 정보에서 에러가 발생한 경우입니다.
- code: '3014'
  title: 'CODE error: This address does not exist. Please confirm the withdrawal address.'
  description: 입금 주소가 상대 Vasp 에서 찾을 수 없는 경우
- code: '3015'
  title: 'CODE error: Recipient information does not match. Please check the information
    registered in either the Coinone withdrawal address list or the beneficiary VASP.'
  description: 코인원에 설정된 수취인 정보와 상대 Vasp 에 설정된 수취인 정보가 다를 경우
- code: '3016'
  title: 'CODE error: Recipient information is invalid. Please check the registered
    information in the Coinone withdrawal address list.'
  description: 코인원 주소록에 설정된 수취인 정보 수정이 필요한 경우.
- code: '3017'
  title: Re-verification of the whitelisted address is required on the website or
    app.
  description: KYC 재이행으로 인해 APP 또는 Web에서 출금주소 재확인이 필요한 경우입니다. 웹 혹은 앱의 주소록에서 화이트리스트
    주소 사용확인에 대한 동의가 필요합니다.
- code: '3018'
  title: Register to the whitelist or withdrawal allowed address list.
  description: 출금 허용 주소 또는 주소록에 추가 정보 등록이 필요합니다.
