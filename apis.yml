aid: coinone
name: Coinone
description: Coinone (코인원) is a South Korean cryptocurrency exchange. Its Open API
  (docs.coinone.co.kr) offers a Public API V2 for market data (markets, tickers, orderbooks,
  trades, charts, currencies) and a signed Private API V2.1 for account balances,
  orders, and deposits/withdrawals, plus public and private WebSocket streams.
